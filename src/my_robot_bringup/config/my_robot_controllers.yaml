controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_group_position_controller:
      type: position_controllers/JointGroupPositionController

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["base_left_1_wheel_joint", "base_left_2_wheel_joint"]
    right_wheel_names: ["base_right_1_wheel_joint", "base_right_2_wheel_joint"]

    wheel_separation: 0.145
    wheel_radius: 0.035

    odom_frame_id: "odom"
    base_frame_id: "base_footprint"

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    enable_odom_tf: false
    publish_rate: 50.0

    linear.x.max_velocity: 0.5
    linear.x.min_velocity: -0.5
    angular.z.max_velocity: 3.0
    angular.z.min_velocity: -3.0

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: imu_sensor
    frame_id: imu_link
    static_covariance_orientation: [0.001, 0.0, 0.0, 0.0, 0.001, 0.0, 0.0, 0.0, 0.001]
    static_covariance_angular_velocity: [0.0001, 0.0, 0.0, 0.0, 0.0001, 0.0, 0.0, 0.0, 0.0001]
    static_covariance_linear_acceleration: [0.0001, 0.0, 0.0, 0.0, 0.0001, 0.0, 0.0, 0.0, 0.0001]

joint_group_position_controller:
  ros__parameters:
    joints:
      - mearm_joint_0
      - mearm_joint_1
      - mearm_joint_2
      - mearm_joint_3
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
